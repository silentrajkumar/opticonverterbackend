[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opticonverterbackend"
version = "0.1.0"
description = "Python API for OptiConverter file conversion tools"
requires-python = ">=3.12"
readme = "README.md"
dynamic = ["dependencies"]

[project.scripts]
opticonverter = "opticonverterbackend.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["ai_converter", "app", "convert_pdf_to_docx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"
