name: Deploy to OCI

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: oci-production
  cancel-in-progress: false

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests and lint checks
        run: |
          python -m pytest
          python -m ruff check .
          python -m ruff format --check .

  deploy:
    name: Deploy backend
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OCI_HOST: ${{ vars.OCI_HOST || '129.225.109.39' }}
      OCI_USER: ${{ vars.OCI_USER || 'ubuntu' }}
      OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
    steps:
      - name: Deploy latest main revision
        shell: bash
        run: |
          set -Eeuo pipefail

          : "${OCI_HOST:?Set the OCI_HOST repository variable}"
          : "${OCI_USER:?Set the OCI_USER repository variable}"
          : "${OCI_SSH_PRIVATE_KEY:?Set the OCI_SSH_PRIVATE_KEY repository secret}"

          install -d -m 700 "$HOME/.ssh"
          key_file="$RUNNER_TEMP/oci_deploy_key"
          known_hosts_file="$HOME/.ssh/oci_known_hosts"
          trap 'rm -f "$key_file"' EXIT

          printf '%s\n' "$OCI_SSH_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
          ssh-keyscan -T 10 -t ed25519 "$OCI_HOST" > "$known_hosts_file" 2>/dev/null
          actual_fingerprint="$(ssh-keygen -lf "$known_hosts_file" | awk '{print $2}')"
          expected_fingerprint="SHA256:rXkLOEq79nBZ2ErtZmeGjaDq5PlxdFNvqWWHWlEx9vw"
          if [[ "$actual_fingerprint" != "$expected_fingerprint" ]]; then
            echo "SSH host fingerprint mismatch for $OCI_HOST; refusing to connect." >&2
            exit 1
          fi
          ssh-keygen -F "$OCI_HOST" -f "$known_hosts_file" >/dev/null

          smtp_password_b64="$(printf '%s' "$SMTP_PASSWORD" | base64 -w 0)"

          {
          printf 'SMTP_PASSWORD_B64=%q\n' "$smtp_password_b64"
          cat <<'REMOTE'
          set -Eeuo pipefail

          app_dir=/opt/opticonverter
          cd "$app_dir"
          git fetch --prune origin
          git checkout main
          git reset --hard origin/main

          if [[ ! -f .env.production ]]; then
            echo "Missing $app_dir/.env.production; configure production environment on the VM first." >&2
            exit 1
          fi
          chmod 600 .env.production

          if [[ -n "${SMTP_PASSWORD_B64:-}" ]]; then
            smtp_password="$(printf '%s' "$SMTP_PASSWORD_B64" | base64 -d)"
            set_env() {
              local key="$1"
              local value="$2"
              sed -i "/^${key}=/d" .env.production
              printf '%s=%s\n' "$key" "$value" >> .env.production
            }
            set_env SMTP_HOST smtp.gmail.com
            set_env SMTP_PORT 587
            set_env SMTP_USERNAME opticonverter@gmail.com
            set_env SMTP_PASSWORD "$smtp_password"
            set_env FEEDBACK_FROM_EMAIL opticonverter@gmail.com
            set_env FEEDBACK_TO_EMAIL opticonverter@gmail.com
            chmod 600 .env.production
          fi

          docker compose --env-file .env.production config -q
          docker compose --env-file .env.production up -d --build --remove-orphans

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              printf '\nDeployment healthy at revision '
              git rev-parse --short HEAD
              docker compose --env-file .env.production ps
              exit 0
            fi
            sleep 2
          done

          echo "Health check failed; recent API logs follow." >&2
          docker compose --env-file .env.production logs --tail=100
          exit 1
          REMOTE
          } | ssh \
            -i "$key_file" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts_file" \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            "$OCI_USER@$OCI_HOST" 'sudo -n bash -s'
